name: crm ci

# Node-side CI for the Payload CRM: lint, unit + integration tests, and the
# marketing-module Playwright e2e suite. The Python event processor has its
# own workflow (event-processor-tests.yml), so its tree is ignored here.

on:
  pull_request:
    paths-ignore:
      - 'event-processor/**'
  push:
    branches: [main]
    paths-ignore:
      - 'event-processor/**'

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    # BTB-536: vitest strips types without checking them, and `pnpm typecheck`
    # excludes tests/**, so nothing type-checked the app in CI or the tests
    # anywhere. The test files are held to a baseline that can only shrink
    # (scripts/check-test-types.mjs).
    name: tsc (app + test files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next-env.d.ts and .next/types are generated, not committed. Without
      # them a fresh checkout cannot resolve the route types, and tsc fails.
      - name: Generate Next.js types
        run: pnpm exec next typegen
      - name: Type-check the app
        run: pnpm typecheck
      - name: Type-check the test files against the baseline
        run: pnpm typecheck:tests

  test:
    name: vitest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # globalSetup spins up Postgres via testcontainers (Docker is available
      # on ubuntu-latest) and runs Payload's push schema sync before tests.
      # Writes vitest-int-report.json (vitest's json reporter) alongside the
      # human-readable output — the next step asserts a minimum test count
      # against it so a run that silently exits 0 having tested nothing
      # cannot pass CI. See scripts/check-test-count.mjs.
      - run: pnpm test:int
      - name: Guard against a silent zero-test run
        run: pnpm test:int:check-count

  e2e:
    name: playwright (marketing module)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billie_crm
          POSTGRES_PASSWORD: billie_crm
          POSTGRES_DB: billie_crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billie_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://billie_crm:billie_crm@localhost:5432/billie_crm_e2e
      PAYLOAD_SECRET: ci-e2e-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Seed pushes the Payload schema into the service Postgres and creates
      # the admin user + marketing fixtures the spec expects.
      - name: Seed marketing fixtures
        run: pnpm exec tsx tests/e2e/seed-marketing.ts
      # Playwright's webServer config boots `pnpm dev` and waits for :3000.
      - name: Run marketing e2e
        run: pnpm exec playwright test tests/e2e/marketing.e2e.spec.ts tests/e2e/releases.e2e.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  fresh-migrate:
    # BTB-534: `payload migrate` must work on an EMPTY database (a new
    # environment, disaster recovery). The other jobs use `push`, so nothing
    # else replays the committed migrations from the start.
    name: payload migrate (empty database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billie_crm
          POSTGRES_PASSWORD: billie_crm
          POSTGRES_DB: billie_crm_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billie_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://billie_crm:billie_crm@localhost:5432/billie_crm_fresh
      PAYLOAD_SECRET: ci-fresh-migrate-secret-not-for-production
      # production: `push` is off, so only the migrations build the schema.
      NODE_ENV: production
      # Same options `make pg-migrate` passes (see infra/fly/Makefile).
      NODE_OPTIONS: --no-deprecation --conditions=development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `payload migrate` can exit 0 having done nothing (the silent no-op
      # infra/fly/Makefile's pg-migrate guards against), so require evidence
      # that migrations ran, and retry once like pg-migrate does.
      - name: Migrate an empty database
        run: |
          for attempt in 1 2; do
            pnpm exec payload migrate 2>&1 | tee migrate.log
            if grep -q "Migrated:" migrate.log; then exit 0; fi
            echo "payload migrate applied nothing on attempt $attempt"
          done
          exit 1
      - name: Migrating again is a no-op
        run: pnpm exec payload migrate
      - name: The reporting views exist
        env:
          PGPASSWORD: billie_crm
        run: |
          views=$(psql -h localhost -U billie_crm -d billie_crm_fresh -At \
            -c "select count(*) from information_schema.views where table_schema = 'reporting'")
          echo "reporting views: $views"
          test "$views" -gt 0
          psql -h localhost -U billie_crm -d billie_crm_fresh -At \
            -c "select cancellation_reason from reporting.loan limit 0"
