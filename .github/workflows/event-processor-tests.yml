name: event-processor tests

# Runs the Python event-processor test suite on PRs and pushes that touch it.
# These are pure unit tests (handlers run against an in-memory MockPool — see
# event-processor/tests/conftest.py), so no Postgres/Redis services are needed.

on:
  pull_request:
    paths:
      - 'event-processor/**'
      - '.github/workflows/event-processor-tests.yml'

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: event-processor-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: event-processor/requirements-dev.txt

      # requirements.txt pulls the private Billie Event SDKs from
      # github.com/BillieLoans/billie-event-sdks and expands ${GITHUB_TOKEN}
      # in the git+https URLs. The workflow's automatic GITHUB_TOKEN is scoped
      # to THIS repo and cannot clone that one, so mint a one-hour, read-only
      # token for it from the org's SDK GitHub App (org variable SDK_APP_ID,
      # org secret SDK_APP_PRIVATE_KEY — see event-processor/README). The
      # legacy SDK_GITHUB_TOKEN secret is the fallback until the App is set up.
      - name: Mint a read-only token for billie-event-sdks
        id: app
        if: vars.SDK_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: BillieLoans
          repositories: billie-event-sdks
          permission-contents: read

      - name: Check an SDK token is available
        env:
          SDK_TOKEN: ${{ steps.app.outputs.token || secrets.SDK_GITHUB_TOKEN }}
        run: |
          if [ -z "$SDK_TOKEN" ]; then
            echo "::error::No SDK credential. Set the org variable SDK_APP_ID and the org"
            echo "::error::secret SDK_APP_PRIVATE_KEY (the SDK GitHub App, read access to"
            echo "::error::BillieLoans/billie-event-sdks)."
            exit 1
          fi

      - name: Install dependencies
        env:
          # requirements.txt expands ${GITHUB_TOKEN}; feed it the SDK token.
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.SDK_GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Matches the Dockerfile (ENV PYTHONPATH=/app/src) — the billie_servicing
          # package lives under src/ and is not pip-installed in this job.
          PYTHONPATH: src
        run: pytest
